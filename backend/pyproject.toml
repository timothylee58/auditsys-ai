[project]
name = "auditsys-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.19",
  "httpx>=0.28.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.2"
]

[tool.ruff]
line-length = 100
target-version = "py312"
