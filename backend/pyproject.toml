[project]
name = "auditsys-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.19",
  "httpx>=0.28.1",
  "supabase>=2.10.0",
  "redis>=5.0.0",
  "openai>=1.55.0",
  "langchain>=0.3.0,<0.4.0",
  "langchain-openai>=0.2.0,<0.3.0",
  "langchain-community>=0.3.0,<0.4.0",
  "langgraph>=0.2.0,<0.3.0",
  "langfuse>=2.0.0",
  # ragas>=0.3 imports langchain_community.chat_models.vertexai, removed in
  # langchain-community 0.4+; pinned below that until ragas drops it upstream.
  "ragas>=0.2.0,<0.3.0",
  "pyyaml>=6.0.0",
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "pypdf>=4.0.0",
  "tiktoken>=0.7.0",
  "azure-identity>=1.19.0",
  "azure-keyvault-secrets>=4.8.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.2"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's dependency-injection idiom (`= File(...)`, `= Depends(...)`)
# relies on calling these in argument defaults; it is not the general
# mutable-default-argument footgun the rule targets.
ignore = ["B008"]
